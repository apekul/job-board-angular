<div class="py-8">
  <h1 class="text-2xl font-bold text-gray-900 mb-6 dark:text-gray-100">Favorites</h1>

  @if (favorites().length === 0) {
    <div
      class="w-full min-h-80 bg-gray-50 border border-gray-200 rounded-xl flex flex-col items-center justify-center text-center px-6 dark:bg-gray-900 dark:border-gray-800"
    >
      <p class="text-gray-500 text-lg dark:text-gray-400">No favorite offers yet.</p>
      <p class="text-gray-400 text-sm mt-1 dark:text-gray-500">
        Tap the heart on any job offer to save it here.
      </p>
      <a
        routerLink="/jobs"
        class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-medium"
      >
        Browse jobs
      </a>
    </div>
  } @else {
    <div class="grid gap-5 items-stretch grid-cols-[repeat(auto-fill,minmax(300px,1fr))]">
      @for (job of jobs(); track job.id) {
        <app-job-card [job]="job" />
      }
    </div>
  }
</div>
